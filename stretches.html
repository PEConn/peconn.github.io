<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caton Clinic Stretch Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    stretch-card {
      display: block;
      order: 0;
    }

    stretch-card[highlighted] {
      order: -1;
    }

    stretch-card[done] {
      order: 999;
    }

    .stretch-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .done-card {
      opacity: 0.6;
      filter: grayscale(0.5);
      background-color: #f3f4f6;
      order: 999;
    }

    .highlight-card {
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
      transform: scale(1.02);
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans text-slate-900 pb-20">

  <div class="max-w-md mx-auto px-4 pt-8">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-800">Caton Clinic</h1>
      <p class="text-slate-500 font-medium">Daily Rehabilitation Plan</p>
      <div id="date-display" class="text-sm text-blue-600 mt-1 font-bold"></div>
    </header>

    <!-- Controls -->
    <div class="flex gap-2 mb-6">
      <button onclick="randomizeNext()" id="random-btn"
        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22" />
          <path d="m18 2 4 4-4 4" />
          <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2" />
          <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8" />
          <path d="m18 14 4 4-4 4" />
        </svg>
        Suggest Random
      </button>
      <button onclick="resetAll()"
        class="bg-white hover:bg-red-50 text-red-500 font-semibold py-3 px-4 rounded-xl border border-red-100 shadow-sm transition-colors">
        Reset
      </button>
    </div>

    <!-- Progress Bar -->
    <div class="mb-8">
      <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">
        <span>Progress</span>
        <span id="progress-text">0/16</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2.5">
        <div id="progress-bar" class="bg-green-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%">
        </div>
      </div>
    </div>

    <!-- Stretch List -->
    <div id="stretch-list" class="flex flex-col gap-4">
      <stretch-card stretch-id="pectoral" title="Pectoral Stretch" reps="60 seconds" sets="1"
        description="Stand with arm against wall, slowly lean forward until chest stretches. Maintain neutral pelvis."
        image="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="bicep" title="Bicep Stretch" reps="60 seconds" sets="1"
        description="Arm outstretched against wall, rotate opposite shoulder away. Keep pelvis neutral."
        image="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="seatedrot" title="Seated Rotations" reps="20 reps" sets="1"
        description="Pole over shoulders, rotate upper body slowly to each side. Limit hip movement."
        image="https://images.unsplash.com/photo-1599058917232-d750c185967c?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="sidebend" title="Side Bend and Rotate" reps="10 seconds" sets="5"
        description="Chin to chest, rotate head to armpit. Add gentle pressure to increase stretch."
        image="https://images.unsplash.com/photo-1566241440091-ec10de8db2e1?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="upperback" title="Upper Back Extenders" reps="10 seconds" sets="5"
        description="Chin tucked, hands above head, lean back over chair edge or foam roller."
        image="https://images.unsplash.com/photo-1531938313491-0300187422f4?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="jock" title="Jock Stretch" reps="60 seconds" sets="1"
        description="Lie on a foam roller or ball between your scapulas, resting your arms down on either side."
        image="https://images.unsplash.com/photo-1518611012118-2969c73a47a8?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="pecmajor" title="Pec Major Release" reps="10s squeeze" sets="5"
        description="Place a ball against a wall or floor on the softest part of your chest and apply pressure."
        image="https://images.unsplash.com/photo-1518611012118-2969c73a47a8?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="pecminor" title="Pec Minor Release" reps="10s squeeze" sets="5"
        description="Place a ball against a wall at chest height (around 3rd–5th rib) and apply pressure."
        image="https://images.unsplash.com/photo-1518611012118-2969c73a47a8?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="scapula" title="Scapula Squeeze (W)" reps="3s squeeze" sets="10"
        description="Laying on front, squeeze shoulder blades lifting arms in a controlled W-shape."
        image="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="ballrolls" title="Ball Rolls" reps="20 seconds" sets="6"
        description="Hold ball against wall at shoulder height. Squeeze scapulas and roll in small circles."
        image="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="shoulderflex" title="Assisted Standing Shoulder Flexion" reps="20 reps" sets="1"
        description="Arms against a wall, slowly slide upwards as far as possible and return (3s up / 3s down)."
        image="https://images.unsplash.com/photo-1518310383802-640c2de311b2?auto=format&fit=crop&q=80&w=400"></stretch-card>
    </div>

    <!-- Extra Section -->
    <div class="mt-8 mb-4">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Extra</h2>
    </div>
    <div id="extra-stretch-list" class="flex flex-col gap-4">
      <stretch-card stretch-id="chintucks" title="Chin Tucks" reps="5s hold" sets="10"
        description="Sit tall or lie flat. Glide chin straight back into a double chin without tilting head."
        image="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="suboccipital" title="Suboccipital Release" reps="60 seconds" sets="1"
        description="Lie on a foam roller or ball at the base of your skull. Slowly nod tiny yes/no motions."
        image="https://images.unsplash.com/photo-1518611012118-2969c73a47a8?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="shoulderdrops" title="Shoulder Drops" reps="30 seconds" sets="2"
        description="Keep head upright. Reach arm behind back, hold wrist with other hand, pull shoulder down."
        image="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="uppertrap" title="Upper Trap Release" reps="60 seconds" sets="2"
        description="Press a ball or foam roller into the meaty top of your shoulder. Keep neck straight."
        image="https://images.unsplash.com/photo-1518611012118-2969c73a47a8?auto=format&fit=crop&q=80&w=400"></stretch-card>
      <stretch-card stretch-id="catcamel" title="Cat / Camel" reps="20 reps" sets="1"
        description="Hands and knees. Slump back towards floor, then arch towards ceiling. Slow pace."
        image="https://images.unsplash.com/photo-1518310383802-640c2de311b2?auto=format&fit=crop&q=80&w=400"></stretch-card>
    </div>
  </div>

  <script>
    // Web Component: <stretch-card>
    class StretchCard extends HTMLElement {
      static get observedAttributes() {
        return ['done', 'highlighted'];
      }

      connectedCallback() {
        this.render();
      }

      get stretchId() {
        return this.getAttribute('stretch-id') || '';
      }

      get title() {
        return this.getAttribute('title') || '';
      }

      get description() {
        return this.getAttribute('description') || '';
      }

      get reps() {
        return this.getAttribute('reps') || '';
      }

      get sets() {
        return this.getAttribute('sets') || '';
      }

      get image() {
        return this.getAttribute('image') || '';
      }

      get done() {
        return this.hasAttribute('done');
      }

      set done(val) {
        if (val) {
          this.setAttribute('done', '');
        } else {
          this.removeAttribute('done');
        }
      }

      get highlighted() {
        return this.hasAttribute('highlighted');
      }

      set highlighted(val) {
        if (val) {
          this.setAttribute('highlighted', '');
        } else {
          this.removeAttribute('highlighted');
        }
      }

      attributeChangedCallback() {
        this.updateState();
      }

      render() {
        if (this._rendered) return;
        this._rendered = true;

        // Unused until I get some good images.
        const image = `
                        <div class="w-24 h-24 flex-shrink-0 bg-slate-100 rounded-lg overflow-hidden border border-slate-100">
                            <img src="${this.image}" alt="${this.title}" class="w-full h-full object-cover">
                        </div>
        `;

        this.innerHTML = `
          <label id="card-${this.stretchId}" class="stretch-card block bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 p-4 cursor-pointer select-none">
            <div class="flex items-start gap-4">
              <input type="checkbox" class="done-checkbox mt-1 w-5 h-5 accent-green-600 rounded border-slate-300 cursor-pointer flex-shrink-0">
              <!-- image would go here -->
              <div class="flex-1">
                <h3 class="stretch-title font-bold text-lg leading-tight mb-1">${this.title}</h3>
                <div class="flex gap-3 text-xs font-bold text-blue-600 mb-2">
                  <span class="bg-blue-50 px-2 py-0.5 rounded">Reps: ${this.reps}</span>
                  <span class="bg-blue-50 px-2 py-0.5 rounded">Sets: ${this.sets}</span>
                </div>
                <p class="text-xs text-slate-500 leading-relaxed line-clamp-2">${this.description}</p>
              </div>
            </div>
          </label>
        `;

        this.querySelector('.done-checkbox').addEventListener('change', () => {
          toggleDone(this.stretchId);
        });

        this.updateState();
      }

      updateState() {
        if (!this._rendered) return;
        const card = this.querySelector('.stretch-card');
        const checkbox = this.querySelector('.done-checkbox');
        const title = this.querySelector('.stretch-title');
        const isDone = this.done;
        const isHighlighted = this.highlighted;

        card.className = `stretch-card block bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 p-4 cursor-pointer select-none ${isDone ? 'done-card' : ''} ${isHighlighted ? 'highlight-card' : ''}`;
        checkbox.checked = isDone;
        title.className = `stretch-title font-bold text-lg leading-tight mb-1 ${isDone ? 'line-through' : ''}`;
      }
    }
    customElements.define('stretch-card', StretchCard);

    let completedIds = [];
    let highlightedId = null;

    function getCards() {
      return Array.from(document.querySelectorAll('stretch-card'));
    }

    function getTodayKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `caton_stretches_${year}-${month}-${day}`;
    }

    function init() {
      // Display current date
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
      document.getElementById('date-display').innerText = dateStr;

      // Load progress from localStorage (resets daily)
      const todayKey = getTodayKey();
      const stored = localStorage.getItem(todayKey);
      if (stored) {
        completedIds = JSON.parse(stored);
      } else {
        // Clear old dates
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const key = localStorage.key(i);
          if (key && key.startsWith('caton_stretches_')) {
            localStorage.removeItem(key);
          }
        }
        save();
      }

      render();
    }

    function toggleDone(id) {
      if (completedIds.includes(id)) {
        completedIds = completedIds.filter(cid => cid !== id);
      } else {
        completedIds.push(id);
        // If it was the highlighted one, clear highlight
        if (highlightedId === id) highlightedId = null;
      }
      save();
      render();
    }

    function save() {
      localStorage.setItem(getTodayKey(), JSON.stringify(completedIds));
    }

    function resetAll() {
      if (confirm("Reset all progress for today?")) {
        completedIds = [];
        highlightedId = null;
        save();
        render();
      }
    }

    function randomizeNext() {
      const remaining = getCards().filter(c => !completedIds.includes(c.stretchId));
      if (remaining.length === 0) {
        alert("All stretches completed! Great job.");
        return;
      }
      const random = remaining[Math.floor(Math.random() * remaining.length)];
      highlightedId = random.stretchId;
      render();

      // Scroll to the highlighted element
      setTimeout(() => {
        const el = document.getElementById('card-' + highlightedId);
        el.scrollIntoView({behavior: 'smooth', block: 'center'});
      }, 100);
    }

    function render() {
      const cards = getCards();

      // Update Progress
      const progress = cards.length ? (completedIds.length / cards.length) * 100 : 0;
      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('progress-text').innerText = `${completedIds.length}/${cards.length}`;

      cards.forEach(card => {
        card.done = completedIds.includes(card.stretchId);
        card.highlighted = card.stretchId === highlightedId;
      });
    }

    window.onload = init;
  </script>
</body>

</html>
