<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caton Clinic Stretch Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .stretch-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .done-card {
      opacity: 0.6;
      filter: grayscale(0.5);
      background-color: #f3f4f6;
      order: 999;
    }

    .highlight-card {
      border: 2px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
      transform: scale(1.02);
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans text-slate-900 pb-20">

  <div class="max-w-md mx-auto px-4 pt-8">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-800">Caton Clinic</h1>
      <p class="text-slate-500 font-medium">Daily Rehabilitation Plan</p>
      <div id="date-display" class="text-sm text-blue-600 mt-1 font-bold"></div>
    </header>

    <!-- Controls -->
    <div class="flex gap-2 mb-6">
      <button onclick="randomizeNext()" id="random-btn"
        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22" />
          <path d="m18 2 4 4-4 4" />
          <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2" />
          <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8" />
          <path d="m18 14 4 4-4 4" />
        </svg>
        Suggest Random
      </button>
      <button onclick="resetAll()"
        class="bg-white hover:bg-red-50 text-red-500 font-semibold py-3 px-4 rounded-xl border border-red-100 shadow-sm transition-colors">
        Reset
      </button>
    </div>

    <!-- Progress Bar -->
    <div class="mb-8">
      <div class="flex justify-between text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">
        <span>Progress</span>
        <span id="progress-text">0/9</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2.5">
        <div id="progress-bar" class="bg-green-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%">
        </div>
      </div>
    </div>

    <!-- Stretch List -->
    <div id="stretch-list" class="flex flex-col gap-4">
      <!-- Stretches will be injected here -->
    </div>
  </div>

  <script>
    // Data structure for stretches
    // To add a new stretch, simply add an object to this array.
    const stretches = [
      {
        id: 'pectoral',
        title: 'Pectoral Stretch',
        description: 'Stand with arm against wall, slowly lean forward until chest stretches. Maintain neutral pelvis.',
        reps: '60 seconds',
        sets: '1',
        image: 'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'bicep',
        title: 'Bicep Stretch',
        description: 'Arm outstretched against wall, rotate opposite shoulder away. Keep pelvis neutral.',
        reps: '60 seconds',
        sets: '1',
        image: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'sidebend',
        title: 'Side Bend and Rotate',
        description: 'Chin to chest, rotate head to armpit. Add gentle pressure to increase stretch.',
        reps: '10 seconds',
        sets: '5',
        image: 'https://images.unsplash.com/photo-1566241440091-ec10de8db2e1?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'upperback',
        title: 'Upper Back Extenders',
        description: 'Chin tucked, hands above head, lean back over chair edge.',
        reps: '10 seconds',
        sets: '5',
        image: 'https://images.unsplash.com/photo-1531938313491-0300187422f4?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'neckext',
        title: 'Neck Extension',
        description: 'Face down, rest forehead on hands. Drag nose along hands until chin hits.',
        reps: '20 reps',
        sets: '1',
        image: 'https://images.unsplash.com/photo-1518611012118-2969c73a47a8?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'scapula',
        title: 'Scapula Squeeze (W)',
        description: 'Laying on front, squeeze shoulder blades lifting arms in a controlled W-shape.',
        reps: '3s squeeze',
        sets: '10 reps',
        image: 'https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'seatedrot',
        title: 'Seated Rotations',
        description: 'Pole over shoulders, rotate upper body slowly to each side. Limit hip movement.',
        reps: '20 reps',
        sets: '1',
        image: 'https://images.unsplash.com/photo-1599058917232-d750c185967c?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'ballrolls',
        title: 'Ball Rolls',
        description: 'Hold ball against wall at shoulder height. Squeeze scapulas and roll in small circles.',
        reps: '20 seconds',
        sets: '6',
        image: 'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'catcamel',
        title: 'Cat / Camel',
        description: 'Hands and knees. Slump back towards floor, then arch towards ceiling. Slow pace.',
        reps: '20 reps',
        sets: '1',
        image: 'https://images.unsplash.com/photo-1518310383802-640c2de311b2?auto=format&fit=crop&q=80&w=400'
      }
    ];

    let completedIds = [];
    let highlightedId = null;

    function init() {
      // Display current date
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
      document.getElementById('date-display').innerText = dateStr;

      // Load progress from localStorage
      const todayKey = 'caton_stretches_' + now.toISOString().split('T')[0];
      const stored = localStorage.getItem(todayKey);
      if (stored) {
        completedIds = JSON.parse(stored);
      } else {
        // Clear old dates
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith('caton_stretches_')) {
            localStorage.removeItem(key);
          }
        }
      }

      render();
    }

    function toggleDone(id) {
      if (completedIds.includes(id)) {
        completedIds = completedIds.filter(cid => cid !== id);
      } else {
        completedIds.push(id);
        // If it was the highlighted one, clear highlight
        if (highlightedId === id) highlightedId = null;
      }
      save();
      render();
    }

    function save() {
      const now = new Date();
      const todayKey = 'caton_stretches_' + now.toISOString().split('T')[0];
      localStorage.setItem(todayKey, JSON.stringify(completedIds));
    }

    function resetAll() {
      if (confirm("Reset all progress for today?")) {
        completedIds = [];
        highlightedId = null;
        save();
        render();
      }
    }

    function randomizeNext() {
      const remaining = stretches.filter(s => !completedIds.includes(s.id));
      if (remaining.length === 0) {
        alert("All stretches completed! Great job.");
        return;
      }
      const random = remaining[Math.floor(Math.random() * remaining.length)];
      highlightedId = random.id;
      render();

      // Scroll to the highlighted element
      setTimeout(() => {
        const el = document.getElementById('card-' + highlightedId);
        el.scrollIntoView({behavior: 'smooth', block: 'center'});
      }, 100);
    }

    function render() {
      const listEl = document.getElementById('stretch-list');
      listEl.innerHTML = '';

      // Update Progress
      const progress = (completedIds.length / stretches.length) * 100;
      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('progress-text').innerText = `${completedIds.length}/${stretches.length}`;

      // Sort stretches: highlighted first, then uncompleted, then completed
      const sorted = [...stretches].sort((a, b) => {
        const aDone = completedIds.includes(a.id);
        const bDone = completedIds.includes(b.id);

        if (a.id === highlightedId) return -1;
        if (b.id === highlightedId) return 1;

        if (aDone && !bDone) return 1;
        if (!aDone && bDone) return -1;
        return 0;
      });

      sorted.forEach(stretch => {
        const isDone = completedIds.includes(stretch.id);
        const isHighlighted = stretch.id === highlightedId;

        const card = document.createElement('div');
        card.id = 'card-' + stretch.id;
        card.className = `stretch-card bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 p-4 ${isDone ? 'done-card' : ''} ${isHighlighted ? 'highlight-card' : ''}`;

        // Unused until I get some good images.
        const image = `
                        <div class="w-24 h-24 flex-shrink-0 bg-slate-100 rounded-lg overflow-hidden border border-slate-100">
                            <img src="${stretch.image}" alt="${stretch.title}" class="w-full h-full object-cover">
                        </div>
        `

        card.innerHTML = `
                    <div class="flex gap-4">
                        <!-- image would go here -->
                        <div class="flex-1">
                            <h3 class="font-bold text-lg leading-tight mb-1">${stretch.title}</h3>
                            <div class="flex gap-3 text-xs font-bold text-blue-600 mb-2">
                                <span class="bg-blue-50 px-2 py-0.5 rounded">Reps: ${stretch.reps}</span>
                                <span class="bg-blue-50 px-2 py-0.5 rounded">Sets: ${stretch.sets}</span>
                            </div>
                            <p class="text-xs text-slate-500 leading-relaxed line-clamp-2">${stretch.description}</p>
                        </div>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <button onclick="toggleDone('${stretch.id}')" class="flex-1 py-2 px-4 rounded-lg font-bold text-sm transition-all ${isDone ? 'bg-slate-200 text-slate-600' : 'bg-green-100 text-green-700 hover:bg-green-200'}">
                            ${isDone ? '✓ Completed' : 'Mark as Done'}
                        </button>
                    </div>
                `;
        listEl.appendChild(card);
      });
    }

    window.onload = init;
  </script>
</body>

</html>
