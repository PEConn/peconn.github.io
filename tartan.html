<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tartan Noir Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .state-none { border-left: 6px solid #4b5563; opacity: 0.6; }
        .state-have { border-left: 6px solid #d97706; }
        .state-read { border-left: 6px solid #059669; background-color: #f0fdf4; }
        .dark .state-read { background-color: #064e3b; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 min-h-screen p-4 md:p-10">

    <div class="max-w-3xl mx-auto">
        <header class="mb-10">
            <h1 class="text-4xl font-bold text-stone-800 dark:text-stone-100">Tartan Noir Tracker</h1>
            <p class="text-stone-500 italic">Edit the source code to update your progress.</p>
        </header>

        <div id="app"></div>
    </div>

    <script>
        /**
         * EDIT THIS DATA TO UPDATE YOUR LIST
         * States available: 'none', 'have', 'read'
         */
        const BOOKS_DATA = [
            {
                author: "Ian Rankin",
                series: "Inspector Rebus",
                books: [
                    { title: "Knots and Crosses", year: 1987, state: "read" },
                    { title: "Hide and Seek", year: 1991, state: "read" },
                    { title: "Tooth and Nail", year: 1992, state: "have" },
                    { title: "Strip Jack", year: 1992, state: "none" },
                    { title: "The Black Book", year: 1993, state: "none" }
                ]
            },
            {
                author: "Val McDermid",
                series: "Tony Hill & Carol Jordan",
                books: [
                    { title: "The Mermaids Singing", year: 1995, state: "read" },
                    { title: "The Wire in the Blood", year: 1997, state: "none" }
                ]
            }
        ];

        // Simple function to render the static HTML
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = BOOKS_DATA.map(section => `
                <section class="mb-12">
                    <h2 class="text-2xl font-bold mb-4 border-b pb-2">${section.author} <span class="text-sm font-normal text-stone-500">— ${section.series}</span></h2>
                    <div class="grid gap-3">
                        ${section.books.map(book => `
                            <div class="state-${book.state} bg-white dark:bg-stone-900 p-4 rounded shadow-sm flex justify-between items-center">
                                <div>
                                    <div class="font-semibold">${book.title}</div>
                                    <div class="text-xs text-stone-400">${book.year}</div>
                                </div>
                                <span class="text-[10px] uppercase font-bold tracking-tighter opacity-70">
                                    ${book.state === 'read' ? '✓ Read' : book.state === 'have' ? 'Owned' : 'Wishlist'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `).join('');
        }

        render();
    </script>
</body>
</html>
